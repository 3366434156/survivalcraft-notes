<!doctype html><html lang=zh><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>404 · SC 源码笔记</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font:15px/1.7 system-ui,"Segoe UI","Microsoft YaHei",sans-serif}.card{max-width:520px;padding:44px 48px;background:#fff;border:1px solid #e6e9f0;border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.06);text-align:center}h1{margin:0 0 6px;font-size:44px;background:linear-gradient(90deg,#4f46e5,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}p{margin:10px 0 0;color:#475569}a{color:#4f46e5}</style></head><body><div class=card><h1>404</h1><p id=m404>页面可能已搬家，正在为你定位…</p><p><a href="https://3366434156.github.io/survivalcraft-notes/index.html">手动返回首页</a></p></div><script>
const BASE="https://3366434156.github.io/survivalcraft-notes/";
const seg=decodeURIComponent(location.pathname).split('/').pop()||'';
const box=document.getElementById('m404');
if(seg&&seg.endsWith('.html')){
  fetch(BASE+'search.json').then(r=>r.json()).then(list=>{
    const hit=list.find(e=>e.u&&e.u.split('/').pop()===seg);
    box.textContent=hit?('找到同名页面，正在跳转：'+hit.t):('没有找到「'+seg+'」，返回首页…');
    setTimeout(()=>location.replace(hit?BASE+hit.u:BASE),1200);
  }).catch(()=>location.replace(BASE));
}else{box.textContent='返回首页…';setTimeout(()=>location.replace(BASE),1200);}
</script></body></html>
